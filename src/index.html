<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>LoopTimer</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- The ∞ and its light on the Start button's cyan. Firefox moves the light round the
             loop; other browsers show it still. The .ico is for browsers without SVG icons. -->
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script>
            // Apply the saved theme before anything draws, so a light theme doesn't flash dark
            // first. ThemeService takes over once the app has loaded.
            try {
                var theme = JSON.parse(localStorage.getItem('settings') || '{}').theme;
                if (theme === 'system') {
                    theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
            } catch (e) {
                // Unreadable settings: stay on the default dark theme
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Audiowide: app font. Roboto 400/500: Material tooltip and FAB. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    </head>
    <!-- The empty touchstart handler makes iPhones show :active styles while a finger is
         down: Safari skips them on pages that listen for no touches -->
    <body class="mat-typography" ontouchstart="">
        <app-root></app-root>
    </body>
</html>
