<h4 [id]="id() + '-recent'" class="sessions__heading">Recent sessions</h4>
<ul class="sessions" [attr.aria-labelledby]="id() + '-recent'">
    @for (session of shown(); track session.entryId) {
        <li class="session">
            <a class="session__link" routerLink="/history" [queryParams]="{ run: session.entryId }">
                <span class="session__date">{{ session.at | date: dateFormat(session.at) }}</span>
                <span class="session__title">{{ session.title }}</span>
            </a>
            @for (line of session.lines; track $index) {
                <span class="session__sets">
                    <span aria-hidden="true">{{ line.text }}</span>
                    <span class="sr-only">{{ line.spoken }}</span>
                </span>
            }
        </li>
    }
</ul>
@if (sessions().length > recentCount) {
    <button type="button" class="sessions__toggle" (click)="showAll.set(!showAll())">
        {{ showAll() ? 'Show fewer' : 'Show all ' + sessions().length }}
    </button>
}
