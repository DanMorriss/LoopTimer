@let frame = box();
<svg
    class="figure"
    [attr.viewBox]="viewBox()"
    [style.aspect-ratio]="frame.width + ' / ' + frame.height"
    preserveAspectRatio="xMidYMax meet"
    focusable="false"
>
    <line
        class="figure__floor"
        [attr.x1]="frame.x"
        [attr.x2]="frame.x + frame.width"
        y1="0"
        y2="0"
    />
    @for (layer of layers(); track layer.name) {
        <g [class]="'figure__layer figure__layer--' + layer.name">
            @for (item of layer.items; track $index) {
                @if (item.type === 'part') {
                    <g [attr.transform]="transformOf(item)">
                        <path class="figure__silhouette" [attr.d]="item.art.outline" />
                        @for (piece of item.art.pieces; track $index) {
                            <path
                                [class]="'figure__muscle figure__muscle--' + toneOf(piece.muscle)"
                                [attr.d]="piece.d"
                            />
                        }
                    </g>
                } @else if (item.type === 'circle') {
                    <circle
                        [class]="'figure__prop figure__prop--' + item.tone"
                        [attr.cx]="item.at[0]"
                        [attr.cy]="item.at[1]"
                        [attr.r]="item.r"
                    />
                } @else if (item.type === 'shape') {
                    <polygon
                        [class]="'figure__prop figure__prop--' + item.tone"
                        [attr.points]="pointsOf(item.points)"
                    />
                } @else {
                    <line
                        [class]="'figure__bar figure__bar--' + item.tone"
                        [attr.x1]="item.from[0]"
                        [attr.y1]="item.from[1]"
                        [attr.x2]="item.to[0]"
                        [attr.y2]="item.to[1]"
                        [attr.stroke-width]="item.width"
                    />
                }
            }
        </g>
    }
</svg>
