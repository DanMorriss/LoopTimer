@let frame = box();
<svg
    class="figure"
    [attr.viewBox]="viewBox()"
    [style.aspect-ratio]="frame.width + ' / ' + frame.height"
    preserveAspectRatio="xMidYMax meet"
    focusable="false"
>
    <line
        class="figure__floor"
        [attr.x1]="frame.x"
        [attr.x2]="frame.x + frame.width"
        y1="0"
        y2="0"
    />
    @for (layer of layers(); track layer.name) {
        <g [class]="'figure__layer figure__layer--' + layer.name">
            @for (pass of passes; track pass) {
                @let grow = pass === 'outline' ? outline : 0;
                @for (shape of layer.shapes; track $index) {
                    @if (shape.type === 'line') {
                        <line
                            [class]="'figure__' + pass + ' figure__' + pass + '--' + shape.tone"
                            [attr.x1]="shape.from[0]"
                            [attr.y1]="shape.from[1]"
                            [attr.x2]="shape.to[0]"
                            [attr.y2]="shape.to[1]"
                            [attr.stroke-width]="shape.width + grow"
                        />
                    } @else if (shape.type === 'circle') {
                        <circle
                            [class]="'figure__' + pass + ' figure__' + pass + '--' + shape.tone"
                            [attr.cx]="shape.at[0]"
                            [attr.cy]="shape.at[1]"
                            [attr.r]="shape.r + grow / 2"
                        />
                    } @else {
                        <polygon
                            [class]="'figure__' + pass + ' figure__' + pass + '--' + shape.tone"
                            [attr.points]="points(shape.points)"
                            [attr.stroke-width]="shape.round + grow"
                        />
                    }
                }
            }
        </g>
    }
</svg>
