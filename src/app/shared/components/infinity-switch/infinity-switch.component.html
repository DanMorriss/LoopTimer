<button
    type="button"
    role="switch"
    class="infinity-switch"
    [class.infinity-switch--on]="checked()"
    [class.infinity-switch--racing]="racing()"
    [attr.aria-checked]="checked()"
    [attr.aria-labelledby]="labelledBy()"
    (click)="toggle()"
>
    <span class="infinity-switch__loop" aria-hidden="true">
        <svg viewBox="0 0 120 60" class="infinity-switch__track">
            <path
                d="M 30 30 C 30 15, 45 15, 60 30 C 75 45, 90 45, 90 30 C 90 15, 75 15, 60 30 C 45 45, 30 45, 30 30 Z"
            />
        </svg>
        <span class="infinity-switch__dot" (animationiteration)="onLap()"></span>
    </span>
    <span class="infinity-switch__state" aria-hidden="true">{{ checked() ? 'On' : 'Off' }}</span>
</button>
