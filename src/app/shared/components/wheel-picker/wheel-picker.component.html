<!-- The scrolling list is the focusable spin button; the numbers inside are visual only -->
<div
    #viewport
    class="wheel-picker__viewport"
    role="spinbutton"
    tabindex="0"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuetext]="valueText()"
    [attr.aria-valuemin]="lowest()"
    [attr.aria-valuemax]="highest()"
    (scroll)="onScroll()"
    (scrollend)="settle()"
    (keydown)="onKeydown($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (touchend)="release()"
    (touchcancel)="release()"
    (focusout)="onFocusOut()"
    (wheel)="onWheel()"
>
    @for (option of options(); track option.value; let i = $index) {
        <div
            class="wheel-picker__item"
            [class.wheel-picker__item--selected]="i === selectedIndex()"
            [attr.data-value]="option.value"
            aria-hidden="true"
            (click)="onItemClick(i)"
        >
            {{ option.label }}
        </div>
    }
</div>
