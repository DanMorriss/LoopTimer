<div class="flex justify-center">
    <div class="m-4 w-full max-w-md rounded-xl border border-slate-700/60 bg-slate-900/35 p-6 shadow-xl shadow-black/30 backdrop-blur-sm">
        <form [formGroup]="timerForm" (ngSubmit)="addTimer()">

            <mat-form-field class="w-full">
                <mat-label>Timer Title</mat-label>
                <input matInput formControlName="title">
            </mat-form-field>

            <p class="p-4 text-center font-bold text-slate-100">Timer</p>

            <div class="flex w-full gap-3">
                <mat-form-field class="flex-1 min-w-0">
                    <mat-label>Minutes</mat-label>
                    <input matInput type="number" formControlName="timerMinutes" min="0">
                </mat-form-field>
                
                <mat-form-field class="flex-1 min-w-0">
                    <mat-label>Seconds</mat-label>
                    <input matInput type="number" formControlName="timerSeconds" min="0">
                </mat-form-field>
            </div>

            <p class="p-4 text-center font-bold text-slate-100">Rest</p>

            <div class="flex w-full gap-3">
            <mat-form-field class="flex-1 min-w-0">
                <mat-label>Minutes</mat-label>
                <input matInput type="number" formControlName="restMinutes" min="0">
            </mat-form-field>

            <mat-form-field class="flex-1 min-w-0">
                <mat-label>Seconds</mat-label>
                <input matInput type="number" formControlName="restSeconds" min="0">
            </mat-form-field>
        </div>

            <div class="flex justify-center m-4">
                <mat-form-field>
                    <mat-label>Rounds</mat-label>
                    <input matInput type="number" formControlName="repeats" min="1">
                    @if (timerForm.controls.repeats.invalid && (timerForm.controls.repeats.dirty || timerForm.controls.repeats.touched)) {
                        <mat-error>Must have at least 1 round</mat-error>
                    }
                </mat-form-field>
            </div>
            
            @if (timerForm.invalid && timerForm.hasError('noTime')) {
                <mat-error>Timer must have some time</mat-error>
            }
            <div class="flex justify-center m-4">
                <button mat-raised-button color="primary" type="submit" [disabled]="!timerForm.valid"><mat-icon>play_circle</mat-icon> Start Timer</button>
            </div>
        </form>
    </div>
</div>
