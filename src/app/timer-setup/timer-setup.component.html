<div class="flex justify-center">
    <div
        class="m-4 w-full max-w-md rounded-xl border border-slate-700/60 bg-slate-900/35 p-6 shadow-xl shadow-black/30 backdrop-blur-sm"
    >
        <form [formRoot]="timerForm">
            <label class="picker-field" for="title">
                <span class="picker-field__label">Timer Title</span>
                <input class="picker-field__input" id="title" [formField]="timerForm.title" />
            </label>

            <p class="p-4 text-center font-bold text-slate-100">Timer</p>

            <div class="picker-row">
                <div class="picker-field">
                    <span class="picker-field__label" id="timerMinutes-label">Minutes</span>
                    <app-wheel-picker
                        id="timerMinutes"
                        [formField]="timerForm.timerMinutes"
                        [options]="minuteOptions"
                        labelledBy="timerMinutes-label"
                    />
                </div>

                <div class="picker-field">
                    <span class="picker-field__label" id="timerSeconds-label">Seconds</span>
                    <app-wheel-picker
                        id="timerSeconds"
                        [formField]="timerForm.timerSeconds"
                        [options]="secondOptions"
                        labelledBy="timerSeconds-label"
                    />
                </div>
            </div>

            <p class="p-4 text-center font-bold text-slate-100">Rest</p>

            <div class="picker-row">
                <div class="picker-field">
                    <span class="picker-field__label" id="restMinutes-label">Minutes</span>
                    <app-wheel-picker
                        id="restMinutes"
                        [formField]="timerForm.restMinutes"
                        [options]="minuteOptions"
                        labelledBy="restMinutes-label"
                    />
                </div>

                <div class="picker-field">
                    <span class="picker-field__label" id="restSeconds-label">Seconds</span>
                    <app-wheel-picker
                        id="restSeconds"
                        [formField]="timerForm.restSeconds"
                        [options]="secondOptions"
                        labelledBy="restSeconds-label"
                    />
                </div>
            </div>

            <div class="m-4 flex justify-center">
                <div class="picker-field picker-field--single">
                    <span class="picker-field__label" id="repeats-label">Rounds</span>
                    <app-wheel-picker
                        id="repeats"
                        [formField]="timerForm.repeats"
                        [options]="repeatOptions"
                        labelledBy="repeats-label"
                    />
                </div>
            </div>

            @if (noTimeError(); as error) {
                <mat-error>{{ error.message }}</mat-error>
            }
            <div class="m-4 flex justify-center">
                <button
                    mat-raised-button
                    color="primary"
                    type="submit"
                    [disabled]="timerForm().invalid()"
                >
                    <mat-icon>play_circle</mat-icon>
                    {{ editingTimerId() ? 'Save & Start Timer' : 'Start Timer' }}
                </button>
            </div>
        </form>
    </div>
</div>
