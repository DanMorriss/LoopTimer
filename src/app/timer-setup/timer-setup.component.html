<div class="flex justify-center">
    <div
        class="m-4 w-full max-w-md rounded-xl border border-slate-700/60 bg-slate-900/35 p-6 shadow-xl shadow-black/30 backdrop-blur-sm"
    >
        <form [formRoot]="timerForm">
            <label class="picker-field" for="title">
                <span class="picker-field__label">Timer Title</span>
                <input class="picker-field__input" id="title" [formField]="timerForm.title" />
            </label>

            <p class="p-4 text-center font-bold text-slate-100">Timer</p>

            <div class="picker-row">
                <label class="picker-field" for="timerMinutes">
                    <span class="picker-field__label">Minutes</span>
                    <select
                        class="picker-field__select"
                        id="timerMinutes"
                        [formField]="timerForm.timerMinutes"
                    >
                        @for (option of minuteOptions; track option.value) {
                            <option
                                [value]="option.value"
                                [selected]="option.value === timerForm.timerMinutes().value()"
                            >
                                {{ option.label }}
                            </option>
                        }
                    </select>
                </label>

                <label class="picker-field" for="timerSeconds">
                    <span class="picker-field__label">Seconds</span>
                    <select
                        class="picker-field__select"
                        id="timerSeconds"
                        [formField]="timerForm.timerSeconds"
                    >
                        @for (option of secondOptions; track option.value) {
                            <option
                                [value]="option.value"
                                [selected]="option.value === timerForm.timerSeconds().value()"
                            >
                                {{ option.label }}
                            </option>
                        }
                    </select>
                </label>
            </div>

            <p class="p-4 text-center font-bold text-slate-100">Rest</p>

            <div class="picker-row">
                <label class="picker-field" for="restMinutes">
                    <span class="picker-field__label">Minutes</span>
                    <select
                        class="picker-field__select"
                        id="restMinutes"
                        [formField]="timerForm.restMinutes"
                    >
                        @for (option of minuteOptions; track option.value) {
                            <option
                                [value]="option.value"
                                [selected]="option.value === timerForm.restMinutes().value()"
                            >
                                {{ option.label }}
                            </option>
                        }
                    </select>
                </label>

                <label class="picker-field" for="restSeconds">
                    <span class="picker-field__label">Seconds</span>
                    <select
                        class="picker-field__select"
                        id="restSeconds"
                        [formField]="timerForm.restSeconds"
                    >
                        @for (option of secondOptions; track option.value) {
                            <option
                                [value]="option.value"
                                [selected]="option.value === timerForm.restSeconds().value()"
                            >
                                {{ option.label }}
                            </option>
                        }
                    </select>
                </label>
            </div>

            <div class="m-4 flex justify-center">
                <label class="picker-field picker-field--single" for="repeats">
                    <span class="picker-field__label">Rounds</span>
                    <select
                        class="picker-field__select"
                        id="repeats"
                        [formField]="timerForm.repeats"
                    >
                        @for (option of repeatOptions; track option.value) {
                            <option
                                [value]="option.value"
                                [selected]="option.value === timerForm.repeats().value()"
                            >
                                {{ option.label }}
                            </option>
                        }
                    </select>
                </label>
            </div>

            @if (noTimeError(); as error) {
                <mat-error>{{ error.message }}</mat-error>
            }
            <div class="m-4 flex justify-center">
                <button
                    mat-raised-button
                    color="primary"
                    type="submit"
                    [disabled]="timerForm().invalid()"
                >
                    <mat-icon>play_circle</mat-icon>
                    {{ editingTimerId() ? 'Save & Start Timer' : 'Start Timer' }}
                </button>
            </div>
        </form>
    </div>
</div>
