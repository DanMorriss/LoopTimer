<!-- Behind the card: what a swipe to the left does, showing as the card slides off it -->
<div class="workout-card__delete" aria-hidden="true">
    <mat-icon>delete</mat-icon>
    Delete
</div>

<!-- The card itself, which slides with a swipe. Pressing it starts the workout; holding it
     (or a right-click) opens its options, as the ⋮ button does -->
<div
    #face
    class="workout-card__face"
    (pointerdown)="press($event)"
    (pointermove)="move($event)"
    (pointerup)="release($event)"
    (pointercancel)="release($event)"
    (contextmenu)="openMenuFromHold($event)"
>
    <button
        type="button"
        class="workout-card__start"
        [attr.aria-label]="'Start ' + name()"
        [attr.aria-describedby]="'workout-summary-' + workout().id"
        (click)="start($event)"
    >
        <mat-icon class="workout-card__play" aria-hidden="true">play_arrow</mat-icon>
        <span class="workout-card__text" aria-hidden="true">
            <span class="workout-card__title" [class.workout-card__title--placeholder]="!title()">
                {{ title() || 'Untitled workout' }}
            </span>
            <span class="workout-card__summary">{{ summary().text }} {{ rounds() }}</span>
        </span>
    </button>
    <span class="sr-only" [id]="'workout-summary-' + workout().id">
        {{ summary().spoken }}, {{ spokenRounds() }}
    </span>

    <div
        class="workout-card__menu-wrap"
        (click)="$event.stopPropagation()"
        (keydown.escape)="menuClosed.emit()"
    >
        <button
            type="button"
            class="btn-icon workout-card__action workout-card__action--menu"
            [attr.data-menu-for]="workout().id"
            [attr.aria-label]="'Open options for ' + name()"
            [attr.aria-expanded]="menuOpen()"
            [attr.aria-controls]="'workout-options-' + workout().id"
            (click)="menuToggled.emit()"
        >
            <mat-icon class="workout-card__action-icon" aria-hidden="true">more_vert</mat-icon>
        </button>

        @if (menuOpen()) {
            <div
                class="menu workout-card__menu"
                [id]="'workout-options-' + workout().id"
                role="group"
                [attr.aria-label]="'Options for ' + name()"
            >
                <button
                    type="button"
                    class="menu__item workout-card__menu-item--edit"
                    (click)="editRequested.emit()"
                >
                    <mat-icon aria-hidden="true">edit</mat-icon>
                    Edit
                </button>
                <button
                    type="button"
                    class="menu__item menu__item--danger workout-card__menu-item--danger"
                    (click)="deleteRequested.emit()"
                >
                    <mat-icon aria-hidden="true">delete</mat-icon>
                    Delete
                </button>
            </div>
        }
    </div>
</div>
