<div class="infinity-container flex flex-col items-center justify-between p-8 gap-8">
    <div class="infinity-logo">
        <!-- Infinity symbol path. Kept in its own SVG so its glow filter isn't re-run while the dot moves -->
        <svg viewBox="0 0 200 100" class="infinity-svg" aria-hidden="true">
            <path
                d="M 50 50 C 50 25, 75 25, 100 50 C 125 75, 150 75, 150 50 C 150 25, 125 25, 100 50 C 75 75, 50 75, 50 50 Z"
                class="infinity-path"
                fill="none"
                stroke="rgba(240, 249, 255, 0.3)"
                stroke-width="4"
            />
        </svg>

        <!-- Animated light dot, layered over the path -->
        <svg viewBox="0 0 200 100" class="dot-svg" aria-hidden="true">
            <defs>
                <radialGradient id="dotGlow">
                    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
                    <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.45" />
                    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
                </radialGradient>
            </defs>
            <!-- With reduced motion, the dot rests where the loops cross (clear of the labels) instead of travelling round them -->
            <g [attr.transform]="reducedMotion() ? 'translate(100 50)' : null">
                @if (!reducedMotion()) {
                    <animateMotion
                        dur="1.5s"
                        repeatCount="indefinite"
                        path="M 50 50 C 50 25, 75 25, 100 50 C 125 75, 150 75, 150 50 C 150 25, 125 25, 100 50 C 75 75, 50 75, 50 50 Z"
                    />
                }
                <g class="light-dot">
                    <circle r="14" class="light-dot__halo" fill="url(#dotGlow)" />
                    <circle r="4" class="light-dot__core" />
                </g>
            </g>
        </svg>
        
        <!-- Interactive zones -->
        <a class="interaction-zone left-zone" routerLink="/setup" title="Create Timer">
            <span class="zone-label">Create</span>
        </a>
        <a class="interaction-zone right-zone" routerLink="/library" title="Timer Library">
            <span class="zone-label">Library</span>
        </a>
    </div>
    
    <div class="title-text">
        <p>Choose Create or Library to get started</p>
    </div>
</div>
