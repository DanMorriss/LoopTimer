<div class="flex justify-center">
    <div
        class="home m-4 w-full max-w-md rounded-xl border border-(--panel-border) bg-(--panel) p-6 shadow-xl shadow-(color:--shadow)"
    >
        <h2 class="sr-only">Home</h2>

        <!-- The weekly plan's workouts for today (PLN-2) -->
        <app-due-today #dueToday class="home__card" />
        @if (hasHistory()) {
            <!-- With a planned workout still to do today, that's what to do next -->
            @if (!dueToday.due().length) {
                <app-suggested-workout class="home__card" />
            }
            <app-muscles-this-week class="home__card" />
        } @else if (!dueToday.due().length) {
            <div class="home__empty">
                <p>Do a workout, and what to do next and the muscles you've worked show here.</p>
                <a routerLink="/library" class="btn-pill">Go to the library</a>
            </div>
        }
    </div>
</div>
