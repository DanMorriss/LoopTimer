<!-- Always there, so what's offered is read out as it appears -->
<div role="status">
    @if (undo.offer(); as offer) {
        <div class="undo-bar" animate.leave="undo-bar--leaving" (keydown.escape)="undo.dismiss()">
            <span class="undo-bar__message" id="undo-bar-message">{{ offer.message }}.</span>
            <button
                #undoButton
                type="button"
                class="undo-bar__undo"
                aria-describedby="undo-bar-message"
                (click)="undo.undo()"
            >
                Undo
            </button>
            <button
                type="button"
                class="btn-icon undo-bar__close"
                aria-label="Close"
                (click)="undo.dismiss()"
            >
                <mat-icon aria-hidden="true">close</mat-icon>
            </button>
        </div>
    }
</div>
