<!-- Three columns with equal sides, so the title stays centred with the back link beside it -->
<div class="nav grid w-full items-center gap-2 p-4">
    @if (onWorkoutPage()) {
        <!-- Down, as the workout folds away into the bar above the tabs; it keeps running -->
        <a
            class="btn-icon nav__back"
            [href]="back().url"
            [attr.aria-label]="back().label"
            [title]="back().label"
            (click)="morph.follow($event, back().url)"
        >
            <mat-icon aria-hidden="true">expand_more</mat-icon>
        </a>
    } @else {
        <div aria-hidden="true"></div>
    }
    <!-- On a phone, the workout page shows the workout's own title here instead of the app's name -->
    <h1
        class="site-title pt-2 text-center text-2xl text-(--text-strong)"
        [class.site-title--workout]="workoutTitle()"
    >
        <span class="site-title__app">Loop Workouts</span>
        @if (workoutTitle()) {
            <span class="site-title__workout">{{ workoutTitle() }}</span>
        }
    </h1>
    <div aria-hidden="true"></div>
</div>
