<div class="timer-card__content" [class.timer-card__content--muted]="showPlay()">
    <p
        class="timer-card__title"
        [class.timer-card__title--placeholder]="!title()"
        [matTooltip]="title() ? 'ID: ' + timer().id : ''"
    >
        {{ title() || 'Untitled timer' }}
    </p>

    <div class="timer-card__row">
        <div class="timer-card__spacer" aria-hidden="true"></div>

        <p class="timer-card__summary" [attr.aria-label]="summary().spoken + ', ' + spokenRounds()">
            {{ summary().text }} x {{ rounds() }}
        </p>

        <div class="timer-card__spacer" aria-hidden="true"></div>
    </div>
</div>

<!-- Always in the tab order so keyboard users can start a timer; shown when the card is selected or the button has focus -->
<button
    type="button"
    class="timer-card__overlay-play"
    [class.timer-card__overlay-play--visible]="showPlay()"
    [attr.aria-label]="'Start ' + name()"
    (focus)="selected.emit()"
    (click)="$event.stopPropagation(); started.emit()"
>
    <mat-icon class="timer-card__overlay-icon" aria-hidden="true">play_circle</mat-icon>
</button>

<div
    class="timer-card__menu-wrap"
    (click)="$event.stopPropagation()"
    (keydown.escape)="menuClosed.emit()"
>
    <button
        type="button"
        class="btn-icon timer-card__action timer-card__action--menu"
        [attr.data-menu-for]="timer().id"
        [attr.aria-label]="'Open options for ' + name()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-controls]="'timer-options-' + timer().id"
        (click)="menuToggled.emit()"
    >
        <mat-icon class="timer-card__action-icon" aria-hidden="true">more_vert</mat-icon>
    </button>

    @if (menuOpen()) {
        <div
            class="menu timer-card__menu"
            [id]="'timer-options-' + timer().id"
            role="group"
            [attr.aria-label]="'Options for ' + name()"
        >
            <button
                type="button"
                class="menu__item timer-card__menu-item--edit"
                (click)="editRequested.emit()"
            >
                <mat-icon aria-hidden="true">edit</mat-icon>
                Edit
            </button>
            <button
                type="button"
                class="menu__item menu__item--danger timer-card__menu-item--danger"
                (click)="deleteRequested.emit()"
            >
                <mat-icon aria-hidden="true">delete</mat-icon>
                Delete
            </button>
        </div>
    }
</div>
