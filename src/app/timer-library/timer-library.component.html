<div class="library-screen p-4 text-sky-50" (click)="clearActiveTimerCard()">
    @let existingTimers = isExistingTimers();
    @if (!existingTimers) {
        <div class="flex justify-center items-center flex-col">
            <p>Nothing in the library yet, best go make a timer.</p>
            <app-infinity-button (click)="navigateToCreateTimer()" text="Create a timer" class="mt-12"></app-infinity-button>
        </div>
        
    }
    <ul class="library-list">
        @for (timer of timerStore.timers(); track timer.id) {
            <li
                appTimerCard
                [timer]="timer"
                [active]="activeTimerCardId() === timer.id"
                [menuOpen]="openTimerMenuId() === timer.id"
                (selected)="setActiveTimerCard(timer.id)"
                (started)="startTimer(timer)"
                (menuToggled)="toggleTimerMenu(timer.id)"
                (menuClosed)="closeTimerMenu(timer.id)"
                (editRequested)="navigateToEditTimer(timer.id)"
                (deleteRequested)="requestDelete(timer)"></li>
        }
    </ul>

    <button
        type="button"
        mat-fab
        extended
        class="library-add-button"
        (click)="$event.stopPropagation(); navigateToCreateTimer()">
        <mat-icon>add</mat-icon>
        Add Timer
    </button>

    @if (timerPendingDelete(); as pendingTimer) {
        <app-delete-timer-dialog [timer]="pendingTimer" (cancelled)="cancelDelete()" (confirmed)="confirmDelete()" />
    }
</div>
