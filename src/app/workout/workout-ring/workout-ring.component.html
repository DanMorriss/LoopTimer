<div
    class="workout-ring"
    [class.workout-ring--work]="phase() === 'work'"
    [class.workout-ring--rest]="phase() === 'rest'"
    [class.workout-ring--reps]="phase() === 'reps'"
    [class.workout-ring--paused]="paused()"
>
    <!-- The progress, for screen readers: a layer of its own rather than the ring itself, as
         a progress bar's contents are hidden from them, and the face's wheels must be found -->
    <div
        class="workout-ring__progress"
        role="progressbar"
        aria-label="Progress through this phase"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="percent()"
        [attr.aria-valuetext]="phase() === 'reps' ? 'Waiting for Done' : null"
    ></div>
    @for (sweep of sweeps(); track sweep.key) {
        <!-- Two rotating half-circles; transforms animate without repainting -->
        <div
            class="workout-ring__sweep"
            [style.--half-duration]="sweep.halfDuration"
            [style.--first-half-delay]="sweep.firstHalfDelay"
            [style.--second-half-delay]="sweep.secondHalfDelay"
            aria-hidden="true"
        >
            <div class="workout-ring__half workout-ring__half--right">
                <div class="workout-ring__fill"></div>
            </div>
            <div class="workout-ring__half workout-ring__half--left">
                <div class="workout-ring__fill"></div>
            </div>
            <!-- Timed work's leading edge, going round with the fill -->
            <div class="workout-ring__tip"></div>
        </div>
    }
    <!-- A rep step's full ring, held a moment after Done as it swells and fades: finish() -->
    <div #flash class="workout-ring__flash" aria-hidden="true"></div>
    <ng-content />
</div>
