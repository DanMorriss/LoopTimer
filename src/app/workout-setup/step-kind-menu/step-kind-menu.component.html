<button
    #pill
    type="button"
    class="step__badge step__kind-button"
    [id]="'step-' + stepKey() + '-kind'"
    [attr.aria-label]="kindName(kind()) + ', change type of step ' + stepNumber()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? 'step-' + stepKey() + '-kinds' : null"
    (click)="toggled.emit()"
>
    <span class="step__kind-label">{{ kindName(kind()) }}</span>
    <mat-icon class="step__kind-arrow" aria-hidden="true">arrow_drop_down</mat-icon>
</button>
@if (open()) {
    <div
        class="menu step__kind-menu"
        animate.leave="menu--leaving"
        [id]="'step-' + stepKey() + '-kinds'"
        role="group"
        [attr.aria-label]="'Type of step ' + stepNumber()"
    >
        @for (option of kinds; track option) {
            <button
                type="button"
                [class]="'menu__item step__kind-option step__kind-option--' + option"
                [attr.aria-pressed]="option === kind()"
                (click)="picked.emit(option)"
            >
                <span class="step__kind-dot" aria-hidden="true"></span>
                {{ kindName(option) }}
                @if (option === kind()) {
                    <mat-icon class="step__kind-check" aria-hidden="true">check</mat-icon>
                }
            </button>
        }
    </div>
}
